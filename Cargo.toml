[package]
name = "pyrust_xlsxwriter"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_pyrust_xlsxwriter"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings. `multiple-pymethods` lets each feature area add its own
# `#[pymethods] impl Worksheet` block in its own file.
pyo3 = { version = "0.28.3", features = [
    "chrono",
    "rust_decimal",
    "multiple-pymethods",
] }
# Writer engine.
rust_xlsxwriter = { version = "0.103.0", features = [
    "chrono",
    "constant_memory",
    "rust_decimal",
    "ryu",
] }
# Reader engine.
calamine = { version = "0.38.0", features = ["dates", "picture"] }
# Editor engine (versions match the ones calamine/rust_xlsxwriter already use).
quick-xml = "0.42"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

chrono = "0.4"
paste = "1.0"
rust_decimal = "1.42.0"

[profile.release]
lto = "thin"
codegen-units = 1
# Turn integer overflow inside dependencies into a catchable error (reported to
# Python as ParameterError) instead of silently wrapping around.
overflow-checks = true
