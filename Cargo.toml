[package]
name = "pyrust_xlsxwriter"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_pyrust_xlsxwriter"
crate-type = ["cdylib"]

[dependencies]
num-bigint = "0.4.6"
pyo3 = { version = "0.28.3", features = [
    "num-bigint",
    "rust_decimal",
    "serde",
] }
rust_decimal = "1.42.0"
rust_xlsxwriter = { version = "0.95.0", features = ["rust_decimal", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
